name: governed-care-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ihss
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: ihss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ihss -d ihss_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ihss:test-password@127.0.0.1:5432/ihss_test
      CORS_ORIGINS: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Generate ephemeral test keys
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUDIT_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PHI_ENCRYPTION_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: backend
      - run: npm run migrate && npm run migrate
        working-directory: backend
      - run: npm test && npm run check && npm audit --audit-level=low
        working-directory: backend
      - run: npm ci && npm run lint && npm run build && npm audit --audit-level=low
        working-directory: frontend
      - run: docker build .
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
